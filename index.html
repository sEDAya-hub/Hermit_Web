<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HERMIT — Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <section id="main-menu" class="screen active">

            <p class="subtitle">ПУТЕШЕСТВИЕ В ФАНТАЗИЮ</p>

            <h1>HERMIT</h1>

            <p class="description">
                Продолжение следует...
            </p>

            <div class="menu-buttons">

                <button id="new-game" class="menu-button primary">
                    Новая игра
                </button>

                <button id="continue-game" class="menu-button">
                    Продолжить
                </button>

                <button id="settings" class="menu-button">
                    Настройки
                </button>

                <button id="about" class="menu-button">
                    Об игре
                </button>

            </div>

            <p class="footer">Путешествие сквозь тьму</p>

        </section>


        <section id="game-screen" class="screen">

            <h2>Путешествие начинается</h2>

            <p>Здесь появится игровая сцена Хермита.</p>

            <button id="back-to-menu" class="menu-button">
                Вернуться в меню
            </button>

        </section>


        <section id="settings-screen" class="screen">

            <h2>Настройки</h2>

            <p>Здесь появятся настройки игры.</p>

            <button class="back-button menu-button">
                Назад
            </button>

        </section>


        <section id="about-screen" class="screen">

            <h2>Об игре</h2>

            <p>HERMIT — путешествие в фантазию.</p>

            <button class="back-button menu-button">
                Назад
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
